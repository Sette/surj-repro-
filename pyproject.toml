[project]
name = "surj-repro"
version = "0.1.0"
description = "Reproduction of Surj (Yang & Howe, WWW'22) on the C-HMCNN benchmarks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.10",
    "numpy>=2.4",
    "networkx>=3.7",
    "scikit-learn>=1.8",
    "scipy>=1.18",
]

[dependency-groups]
dev = ["pytest>=9.0"]
